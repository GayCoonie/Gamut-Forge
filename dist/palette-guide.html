<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palette info &amp; color atlas · Gamut Forge</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#121018;color:#eae5f0}body{max-width:1440px;margin:auto;padding:24px}a{color:#63ead8}h1{margin:.2em 0;font-size:clamp(24px,4vw,40px)}p{max-width:85ch;color:#bfb6cc}nav,.controls,.downloads{display:flex;gap:16px;align-items:center;flex-wrap:wrap}nav{justify-content:space-between}select,button{font:inherit;background:#262030;color:inherit;border:1px solid #665372;padding:8px;border-radius:6px}.stat{font-variant-numeric:tabular-nums;color:#63ead8}canvas{width:100%;display:block;border:1px solid #3b3147;background:#19151f;margin:20px 0}#tooltip{min-height:1.5em;font-family:monospace;color:#63ead8}small{color:#bfb6cc}label{display:flex;gap:8px;align-items:center}#description{min-height:3em}
</style>
</head>
<body>
<nav><a href="./palette-library.html">← Palette library</a><a id="usePalette" href="./">Use this palette →</a></nav>
<h1 id="title">Palette info &amp; color atlas</h1>
<p>Explore every built-in palette on the same lightness/chroma axes, or switch to an unobstructed swatch grid. Downloads preserve the exact colors used by the quantizer.</p>
<div class="controls">
<label>Palette <select id="palette"><option value="staticBloom1024">Static Bloom · 1024</option><option value="staticBloom4096">Static Bloom · 4096</option><option value="rgb343Control">RGB343 · 1024</option></select></label>
<label>View <select id="view"><option value="space">Lightness / chroma hue pages</option><option value="swatches">Every swatch</option></select></label>
<span class="stat" id="stats"></span>
</div>
<p id="description"></p>
<div class="downloads" id="downloads"></div>
<canvas id="chart" width="1440" height="1050" aria-label="Palette colors positioned on twelve CIELAB lightness and chroma pages"></canvas>
<div id="tooltip" aria-live="polite">Point to a color to inspect its hex value.</div>
<small id="caption"></small>
<script src="./palettes.js"></script>
<script src="./retro-source-union-4096.js"></script>
<script src="./retro-source-union-1024.js"></script>
<script src="./critter-palettes.js"></script>
<script src="./hsv-three-tier-64.js"></script>
<script src="./hsv-three-tier-10.js"></script>
<script src="./hsv-three-tier-sketch.js"></script>
<script src="./random-strata.js"></script>
<script src="./random-strata-v2-trials.js"></script>
<script src="./okhsv-sketch.js"></script>
<script src="./palette-catalog.js"></script>
<script src="./color-math.js"></script>
<script>
const meta=Object.fromEntries(window.GAMUT_CATALOG.map(p=>[p.key,[p.stem,p.description]]));
const select=document.querySelector('#palette'),view=document.querySelector('#view'),canvas=document.querySelector('#chart'),ctx=canvas.getContext('2d');let hits=[];
select.replaceChildren(...window.GAMUT_CATALOG.map(p=>new Option(p.name,p.key)));
const requested=new URLSearchParams(location.search).get('palette');if(meta[requested])select.value=requested;
async function draw(){
 const key=select.value,[stem,description]=meta[key],colors=window.GAMUT_PALETTES[key].colors;
 history.replaceState(null,'','?palette='+key);document.title=window.GAMUT_PALETTES[key].name+' · Gamut Forge';
 document.querySelector('#description').textContent=description;
 document.querySelector('#title').textContent=window.GAMUT_PALETTES[key].name;
 document.querySelector('#usePalette').href='./?palette='+key;
 document.querySelector('#stats').textContent=colors.length.toLocaleString()+' unique colors';
 document.querySelector('#downloads').innerHTML=['txt','gpl','kpl','json','png'].map(ext=>`<a href="./palettes/${stem}.${ext}" download>${ext==='gpl'?'GIMP':ext==='kpl'?'Krita':ext.toUpperCase()}</a>`).join('')+`<a href="./palettes/${stem}-package.zip" download>All formats (ZIP)</a>`;
 if(key.startsWith('randomStrata')){const link=document.createElement('a');link.href='./random-strata.html';link.textContent='Trial reports & generator →';document.querySelector('#downloads').append(link);}
 const diagram=window.GAMUT_CATALOG.find(p=>p.key===key).diagram;
 if(diagram){const link=document.createElement('a');link.href='./'+diagram;link.textContent='Sampling diagram →';document.querySelector('#downloads').append(link);}
 const grid=view.value==='swatches';canvas.height=grid?1440:1050;hits=[];ctx.fillStyle='#19151f';ctx.fillRect(0,0,canvas.width,canvas.height);
 colors.forEach((hex,i)=>{
  const rgb=[1,3,5].map(p=>parseInt(hex.slice(p,p+2),16)),[L,a,b]=GamutColor.rgbToLab(...rgb),C=Math.hypot(a,b),h=(Math.atan2(b,a)*180/Math.PI+360)%360;
  let x,y,w;
  if(grid){const side=Math.sqrt(colors.length);w=1440/side;x=i%side*w;y=Math.floor(i/side)*w;}
  else{const panel=C<.0002?0:Math.floor(h/30);x=panel%4*360+42+C/145*296;y=Math.floor(panel/4)*350+308-L/100*266;w=colors.length===4096?5:8;x-=w/2;y-=w/2;}
  ctx.fillStyle=hex;ctx.fillRect(x,y,w,w);hits.push({x,y,w,hex,L,C,h});
 });
 if(!grid){ctx.font='14px system-ui';for(let panel=0;panel<12;panel++){const x=panel%4*360,y=Math.floor(panel/4)*350;ctx.fillStyle='#cfc5dc';ctx.fillText(`${panel*30}–${(panel+1)*30}° Lab hue`,x+42,y+24);ctx.strokeStyle='#55465f';ctx.beginPath();ctx.moveTo(x+40,y+40);ctx.lineTo(x+40,y+310);ctx.lineTo(x+338,y+310);ctx.stroke();ctx.font='11px system-ui';ctx.fillText('100',x+9,y+47);ctx.fillText('L*',x+9,y+177);ctx.fillText('0',x+20,y+311);ctx.fillText('0',x+39,y+329);ctx.fillText('Chroma C* →',x+138,y+329);ctx.fillText('145',x+317,y+329);ctx.font='14px system-ui';}}
 document.querySelector('#caption').textContent=grid?'Every palette color appears once, in its stored order. No colors are interpolated.':'Each square is an actual palette color, positioned by CIELAB D65 lightness and chroma within a 30° hue slice. All panels use the same scale. Squares can overlap; their area does not represent gamut volume. True grays appear in the first panel. Use Every swatch to see each entry separately.';
 try{const data=await fetch('./palettes/'+stem+'.json').then(r=>r.json());if(select.value===key && Number.isFinite(data.report?.minimum_delta_e_2000))document.querySelector('#stats').textContent=`${colors.length.toLocaleString()} colors · minimum ${data.report.minimum_delta_e_2000.toFixed(3)} ΔE00`;}catch(_){/* Swatches remain usable if metadata is unavailable. */}
}
canvas.addEventListener('pointermove',e=>{const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)*canvas.width/box.width,y=(e.clientY-box.top)*canvas.height/box.height;const hit=hits.findLast(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.w);if(hit)document.querySelector('#tooltip').textContent=`${hit.hex} · L* ${hit.L.toFixed(2)} · C* ${hit.C.toFixed(2)} · hue ${hit.h.toFixed(1)}°`;});
select.addEventListener('change',draw);view.addEventListener('change',draw);draw();
</script>
</body>
</html>
